# ARR default configuration
# Override by passing --config <path> to the CLI, or by setting ARR_<UPPER_KEY>
# environment variables (Pydantic Settings convention).

arxiv:
  # Categories to pull daily. Filter stage handles the narrowing to in-scope topics.
  categories:
    - cs.CL  # Computation and Language (primary)
    - cs.LG  # Machine Learning
    - cs.AI  # Artificial Intelligence
    - cs.IR  # Information Retrieval
  lookback_hours: 24
  max_results_per_category: 200

filter:
  # Cosine similarity above this against the last 30 days drops a paper as duplicate
  dedup_similarity_threshold: 0.92
  dedup_lookback_days: 30
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"

  # Fast lexical pre-screen. Drops any paper whose title+abstract doesn't
  # mention an explicit LLM marker before the LLM filter call. Matching is
  # case-insensitive substring against title + abstract.
  keyword_prefilter:
    enabled: true
    keywords:
      # Explicit model talk
      - "LLM"
      - "large language model"
      - "GPT"
      - "ChatGPT"
      - "Claude"
      - "Gemini"
      - "Llama"
      - "Mistral"
      # RAG and retrieval-for-LLMs
      - "RAG"
      - "retrieval-augmented"
      - "retrieval augmented"
      # Post-training and adaptation
      - "fine-tun"
      - "instruction tun"
      - "instruction-tun"
      - "RLHF"
      - "RLAIF"
      - "DPO"
      - "LoRA"
      - "PEFT"
      # Inference-time techniques
      - "in-context"
      - "in context learning"
      - "chain-of-thought"
      - "chain of thought"
      - "prompt engineering"
      - "prompting"
      - "long-context"
      - "long context"
      - "context window"
      - "tool use"
      - "tool-use"
      - "function calling"
      # Agents
      - "LLM agent"
      - "agentic"
      - "multi-agent LLM"
      # Evaluation specific to LLMs
      - "MMLU"
      - "HumanEval"
      - "SWE-bench"
      - "HotpotQA"
      - "MT-Bench"

ranker:
  weights:
    significance: 0.30
    novelty: 0.25
    reproducibility: 0.20
    clarity: 0.15
    topical_fit: 0.10

selector:
  # Default 7.0. Calibrate against observed posting frequency over the first two months.
  post_worthy_threshold: 7.0

# Hard cap on papers that reach PDF processing and ranking each run.
# Survivors of the filter beyond this limit are dropped (most-recent first).
# Bounds the worst-case cost and wall time when arxiv has a heavy day or a
# weekend backlog gets pulled in. Override per-run with `--max-candidates N`.
max_candidates_per_run: 10

drafter:
  # Premium model. Output quality drives the product.
  model: "anthropic/claude-sonnet-4.6"
  max_retries: 3
  length:
    target_min: 1400
    target_max: 1800
    hook_max: 140
    hard_min: 1100
    hard_max: 2000

critic:
  # Separate prompt; sees post text and claims, not the drafter's reasoning.
  model: "anthropic/claude-sonnet-4.6"

# Cheap model used by the filter and ranker stages.
cheap_model: "anthropic/claude-haiku-4.5"

storage:
  reviews_dir: "reviews"
  cache_dir: ".cache"

llm:
  provider: "openrouter"
  base_url: "https://openrouter.ai/api/v1"
  # API key comes from OPENROUTER_API_KEY env var, never config.
