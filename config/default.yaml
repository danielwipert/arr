# ARR default configuration
# Override by passing --config <path> to the CLI, or by setting ARR_<UPPER_KEY>
# environment variables (Pydantic Settings convention).

arxiv:
  # Categories to pull daily. Filter stage handles the narrowing to in-scope topics.
  categories:
    - cs.CL  # Computation and Language (primary)
    - cs.LG  # Machine Learning
    - cs.AI  # Artificial Intelligence
    - cs.IR  # Information Retrieval
  # 96h, not 24h: arXiv announces Mon-Fri at 20:00 ET, so on Monday
  # morning the freshest API content is from late Friday — a 24h window
  # misses it entirely. Dedup gates re-posting, so a wider window is free.
  lookback_hours: 96
  # 30 per category × 4 categories ≈ 120 raw papers/day. arXiv returns
  # newest-first, so this is the most-recent slice, not a random sample.
  # Enough to choose from after the keyword prefilter narrows the field;
  # large enough to absorb a heavy posting day on cs.CL without missing
  # the LLM-relevant work that lands under cs.LG/cs.AI/cs.IR.
  max_results_per_category: 30

filter:
  # Dedup is an exact arxiv_id match against the last N days of processed/
  # artifacts. Matches storage.retention_days: the retention prune deletes
  # those folders after 7 days, so anything beyond that is invisible anyway.
  dedup_lookback_days: 7

  # Fast lexical pre-screen. Drops any paper whose title+abstract doesn't
  # mention an explicit LLM marker before the LLM filter call. Matching is
  # case-insensitive substring against title + abstract.
  keyword_prefilter:
    enabled: true
    keywords:
      # Explicit model talk
      - "LLM"
      - "large language model"
      - "GPT"
      - "ChatGPT"
      - "Claude"
      - "Gemini"
      - "Llama"
      - "Mistral"
      # RAG and retrieval-for-LLMs
      - "RAG"
      - "retrieval-augmented"
      - "retrieval augmented"
      # Post-training and adaptation
      - "fine-tun"
      - "instruction tun"
      - "instruction-tun"
      - "RLHF"
      - "RLAIF"
      - "DPO"
      - "LoRA"
      - "PEFT"
      # Inference-time techniques
      - "in-context"
      - "in context learning"
      - "chain-of-thought"
      - "chain of thought"
      - "prompt engineering"
      - "prompting"
      - "long-context"
      - "long context"
      - "context window"
      - "tool use"
      - "tool-use"
      - "function calling"
      # Agents
      - "LLM agent"
      - "agentic"
      - "multi-agent LLM"
      # Evaluation specific to LLMs
      - "MMLU"
      - "HumanEval"
      - "SWE-bench"
      - "HotpotQA"
      - "MT-Bench"

ranker:
  weights:
    significance: 0.30
    novelty: 0.25
    reproducibility: 0.20
    clarity: 0.15
    topical_fit: 0.10

selector:
  # 0.0 means the top-ranked paper always wins. The pipeline is configured
  # to post every day a paper survives filter+rank, not to gate on a
  # composite floor.
  post_worthy_threshold: 0.0

# Hard cap on papers that reach PDF processing and ranking each run.
# Survivors of the filter beyond this limit are dropped (most-recent first).
# Bounds the worst-case cost and wall time when arxiv has a heavy day or a
# weekend backlog gets pulled in. Override per-run with `--max-candidates N`.
max_candidates_per_run: 10

drafter:
  model: "deepseek/deepseek-chat-v3.1"
  # One retry, then ship. The finalizer accepts the last attempt even if
  # the critic rejects it, so retries here only buy a chance to address
  # critic feedback — they no longer gate publication.
  max_retries: 2
  length:
    target_min: 1400
    target_max: 1800
    hook_max: 140
    hard_min: 1100
    hard_max: 2000

critic:
  # Separate prompt; sees post text and claims, not the drafter's reasoning.
  # Its verdict is recorded on the final post but no longer skips the day.
  model: "deepseek/deepseek-chat-v3.1"

# Cheap model used by the filter and ranker stages.
cheap_model: "deepseek/deepseek-chat-v3.1"

storage:
  reviews_dir: "reviews"
  cache_dir: ".cache"
  # Daily output folders older than this are deleted at the start of each run.
  # Keeps local disk and any future repo backups bounded without manual cleanup.
  retention_days: 7

llm:
  provider: "openrouter"
  base_url: "https://openrouter.ai/api/v1"
  # API key comes from OPENROUTER_API_KEY env var, never config.
