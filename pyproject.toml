[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arr"
version = "0.1.0"
description = "AI Research Radar — LinkedIn Drafter. A daily pipeline that selects post-worthy AI research papers and drafts LinkedIn posts in a deliberate editorial voice."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Daniel Wipert" }]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "arxiv>=2.1",
    "pypdf>=4.2",
    "pdfplumber>=0.11",
    "sentence-transformers>=2.7",
    "numpy>=1.26",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
arr = "arr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arr"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
